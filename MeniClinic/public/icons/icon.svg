<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle Medical Cross Accent Rings -->
  <circle cx="256" cy="240" r="160" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" fill="none"/>
  <circle cx="256" cy="240" r="190" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5" fill="none"/>

  <!-- Main Symbol: Medical Cross + Stylized 'M' Pulse -->
  <g filter="url(#shadow)">
    <!-- Medical Cross with Rounded Edges -->
    <path d="M226 130 C226 121.2 233.2 114 242 114 L270 114 C278.8 114 286 121.2 286 130 L286 210 L366 210 C374.8 210 382 217.2 382 226 L382 254 C382 262.8 374.8 270 366 270 L286 270 L286 350 C286 358.8 278.8 366 270 366 L242 366 C233.2 366 226 358.8 226 350 L226 270 L146 270 C137.2 270 130 262.8 130 254 L130 226 C130 217.2 137.2 210 146 210 L226 210 Z" fill="url(#cross)"/>
    <!-- Center Pulse Line -->
    <path d="M176 240 L216 240 L236 200 L260 274 L280 224 L296 240 L336 240" fill="none" stroke="#0f766e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom Label -->
  <text x="256" y="432" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="1.5">MENICLINIC</text>
</svg>